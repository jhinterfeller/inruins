  <style>
    /* Clean, unboxed gallery layout */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 36px 24px;
      align-items: start;
    }

    .photo-grid figure {
      margin: 0;
      padding: 0;
      border: none;
      background: transparent;
    }

    /* Entire photo displays naturally without cropping or background frames */
    .photo-grid img {
      width: 100%;
      height: auto;
      display: block;
      border: 1px solid rgba(0, 0, 0, 0.15); /* Subtle dark border matching newspaper aesthetic */
    }

    .photo-grid figcaption {
      margin-top: 10px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.75;
      line-height: 1.4;
    }
  </style>
</head>
