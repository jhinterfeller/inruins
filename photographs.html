  }

    max-width: 768px;
  }
}

  .container{
    max-width: 1024px;
  }
}
@media (min-width: 1280px){
  .container{
    max-width: 1280px;
  }
}

  .container{

  }
}
.block{

}
.flex{

}
.grid{

}
.hidden{

}

:root{
  --indigo:#1e3a7a;
  --gold:#C8A030;
  --line:rgba(0,0,0,0.08);
  --bg:#e3dac0;
  --paper:#e3dac0;
}
* {
  box-sizing:border-box;
}
html,body {
  margin:0;
  padding:0;
}
body{
  background:var(--bg);
  color:#111;
  font-family:"Cormorant Garamond",serif;
  -webkit-font-smoothing:antialiased;
}
/* --- original shell --- */
.site-header{
  padding:14px 20px;
  border-bottom:1px solid var(--line);
  background:#e3dac0;
  position:sticky;
  top:0;
  z-index:10;
}
.nav{
  max-width:1400px;
  margin:0 auto;
  display:flex;
  justify-content:space-between;
  align-items:center
}
.brand{
  font-family:"Inter",sans-serif;
  font-size:11px;
  letter-spacing:0.32em;
  text-transform:uppercase;
  font-weight:600;
  text-decoration:none;
  color:#000
}
.navlinks{
  display:flex;
  gap:26px
}
.navlinks a{
  font-family:"Inter",sans-serif;
  font-size:11px;
  letter-spacing:0.18em;
  text-transform:uppercase;
  text-decoration:none;
  color:#000;
  opacity:0.6
}
.navlinks a.active,.navlinks a:hover{
  opacity:1;
  border-bottom:1px solid #000
}
.page-hero{
  padding:80px 40px 40px 40px;
  max-width:1400px;
  margin:0 auto
}
.kicker{
  font-family:"Inter",sans-serif;
  color:var(--gold);
  font-size:11px;
  letter-spacing:0.28em;
  text-transform:uppercase;
  font-weight:600;
  margin-bottom:8px
}
.page-hero h1{
  font-family:"Dancing Script",cursive;
  color:var(--indigo);
  font-size:68px;
  line-height:0.95;
  margin:0 0 12px 0;
  font-weight:600;
  letter-spacing:-0.02em
}
.page-hero p{
  font-family:"Dancing Script",cursive;
  color:var(--indigo);
  font-size:30px;
  margin:0;
  opacity:0.9
}
/* --- required wandering spec --- */
.section-gallery{
  max-width:1400px;
  margin:0 auto;
  position:relative;
  padding:20px 40px 120px 40px;
}
.archive-grid{
  display:grid;
  grid-template-columns:repeat(12,1fr);
  gap:80px 28px;
  position:relative;
  z-index:1;
  align-items:start;
}
.gallery-item{
  position:relative;
  background:#e3dac0;
  border:1px solid var(--line);
  padding:0;
  box-shadow:0 4px 24px rgba(0,0,0,0.04);
}
.gallery-item img{
  width:100%;
  height:auto;
  display:block;
}
/* wandering logic 6 patterns */
.archive-grid .gallery-item:nth-child(6n+1){
  grid-column:1 / span 4;
  transform:rotate(-0.7deg);
  margin-top:0;
}
.archive-grid .gallery-item:nth-child(6n+2){
  grid-column:6 / span 3;
  transform:rotate(0.5deg);
  margin-top:40px;
}
.archive-grid .gallery-item:nth-child(6n+3){
  grid-column:10 / span 3;
  transform:rotate(-0.4deg);
  margin-top:90px;
}
.archive-grid .gallery-item:nth-child(6n+4){
  grid-column:2 / span 3;
  transform:rotate(0.6deg);
  margin-top:-10px;
}
.archive-grid .gallery-item:nth-child(6n+5){
  grid-column:6 / span 5;
  transform:rotate(-0.5deg);
  margin-top:30px;
}
.archive-grid .gallery-item:nth-child(6n+6){
  grid-column:9 / span 4;
  transform:rotate(0.8deg);
  margin-top:10px;
}
/* figcaption same as original */
figcaption{
  margin-top:0;
  display:flex;
  justify-content:space-between;
  gap:20px;
  border-top:1px solid var(--line);
  padding:10px 8px 10px 8px;
}
.caption-main{
  font-family:"Dancing Script",cursive;
  color:var(--indigo);
  font-size:20px;
  line-height:1.2;
}
.plate-no{
  font-family:"Cormorant Garamond",serif;
  font-style:italic;
  color:var(--indigo);
  opacity:0.6;
  font-size:14px;
  white-space:nowrap;
}
/* spiral - pulled wind spinner / stretched slinky */
.spiral-svg{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:0;
  opacity:0.16;
}
/* lightbox */
.lightbox{
  display:none;
  position:fixed;
  inset:0;
  z-index:999;
  background:rgba(255,255,255,0.96);
  backdrop-filter:blur(8px);
  align-items:center;
  justify-content:center;
  padding:40px;
}
.lightbox:target{
  display:flex;
  flex-direction:column;
}
.lightbox img{
  max-width:90vw;
  max-height:80vh;
  box-shadow:0 20px 60px rgba(0,0,0,0.18);
  border:1px solid var(--line);
}
.lightbox-caption{
  margin-top:20px;
  font-family:"Dancing Script",cursive;
  color:var(--indigo);
  font-size:22px;
  text-align:center;
}
.lightbox-close{
  position:absolute;
  top:24px;
  right:32px;
  font-size:36px;
  text-decoration:none;
  color:#000;
  opacity:0.6;
}
.lightbox-close:hover{
  opacity:1
}
footer{
  border-top:1px solid var(--line);
  padding:40px;
  max-width:1400px;
  margin:0 auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.footer-brand{
  font-family:"Inter",sans-serif;
  font-size:11px;
  letter-spacing:0.32em;
  text-transform:uppercase;
  font-weight:600
}
.small{
  font-family:"Cormorant Garamond",serif;
  font-style:italic;
  color:#555
}
@media(max-width:768px){
  .site-header{
    padding:20px
  }
  .page-hero{
    padding:48px 20px 20px 20px
  }
  .page-hero h1{
    font-size:48px
  }
  .section-gallery{
    padding:10px 20px 80px 20px
  }
  .spiral-svg{
    display:none
  }
  .archive-grid{
    grid-template-columns:1fr;
    gap:36px
  }
  .archive-grid .gallery-item{
    grid-column:1 / -1 !important;
    transform:none !important;
    margin-top:0 !important;
    width:92vw;
    margin-left:auto;
    margin-right:auto;
  }
}
